[project]
name = "call-me-maybe"
version = "0.1.0"
description = "A function calling tool that translates natural language into structured function arguments using an LLM."
readme = "README.md"
authors = [
    { name = "Lucas Paiva", email = "lpaiva234@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=2.3.0",
    "numpy>=2.2.6",
    "pydantic>=2.14.1",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.mypy]

[[tool.mypy.overrides]]
module = "llm_sdk.*"
ignore_errors = true
